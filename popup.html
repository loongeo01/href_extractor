<!DOCTYPE html>
<html lang="en">

<head>
    <link href="./public/output2.css" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="margin: 0; height: 450px;">
    <div class="main_box">
        <div style="width: 332px; margin-bottom: 5px; margin-top: 7px; display: flex; justify-content: space-between;">
            <button class="sBtn selectAll hide btn btn-xs"
                style="padding-left: 0px; padding-right: 0px; width: max-content;">Select
                All</button>
            <button class="minimize_popup_btn btn"
                style="height: 17px; width: 30px; padding-left: 0px; padding-right: 0px; padding-bottom: 9px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
                    <title>minimize</title>
                    <path fill="currentColor" d="M6 21v-2h12v2z" />
                </svg>
            </button>
        </div>


        <ul class="hrefs_box list bg-base-100 rounded-box shadow-md">
        </ul>

        <div class=functions>
            <div class="left_buttons">

                <img class="funBtn Start" src="/assets/play.png" style="width: 2rem; height: 2rem;">


                <img class="funBtn Reset" src="/assets/undo.png" style="width: 2rem; height: 2rem;">
            </div>


            <div class="selected_buttons">

                <img class="sBtn Delete hide" src="/assets/delete-gray.png">


                <img class="sBtn Copy hide" src="/assets/copy-gray.png">


                <img class="sBtn Export hide" src="/assets/csv.png">
            </div>
        </div>

        <div class="misc_options">
            <div style="display: flex; gap: 9px; align-content: center; flex-wrap: wrap;">
                <input type="text" class="seperator_for_copying_yes input" value=", " />
                <label for="seperator" class="label">Copy Seperator</label>
            </div>

            <label class="label">
                <input type="checkbox" class="checkbox_for_popup_yes checkbox" />
                <span style="margin-left: 3px;">Allow Duplicates</span>
            </label>

            <div
                style="display: flex; height: 21.2px; gap: 50px; align-content: baseline; flex-wrap: wrap; justify-content: space-between;">
                <label class="label">
                    <input type="checkbox" class="checkbox_for_show_hide_area checkbox" />
                    <span style="margin-left: 3px;">Show Target Area</span>

                </label>
                <div class="btn btn-ghost GoToSetAreaPlace"
                    style="width: 57px; height: 24.2px; padding-left: 0; padding-right: 0;">Set Area</div>
            </div>

        </div>

    </div>

    <div class="select_area remove">
        <div
            style="display: flex; flex-direction: column; gap: 1rem; width: 100%; height: 100%; justify-content: center; align-items: center;">
            <button class="setAreaPP btn" style="width: 50%;">Set</button>
            <button class="cancelSetAreaPP remove btn" style="width: 50%;">Cancel</button>
            <button class="resetSetAreaPP remove btn" style="width: 50%;">Reset</button>
            <button class="minimize_popup_btn2 btn" style="width: 50%; padding-left: 0px; padding-right: 0px;">
                Minimize Window
            </button>
            <button class="goBackToHomePP btn" style="width: 50%;">Go Back</button>
        </div>
    </div>

    <script type="module" src="dist/main.js"></script>
</body>

</html>
